name: MCP Server Tests

on:
  pull_request:
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test (Node 22)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
